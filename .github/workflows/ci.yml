name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run test:mcp
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t priority-mcp-server:test .
      - name: Offline container health check
        run: |
          docker run -d --name priority-smoke -p 127.0.0.1:3000:3000 -e PRIORITY_SERVICE_ROOT=https://example.invalid/odata/Priority/offline/demo -e PRIORITY_PAT=synthetic -e PRIORITY_READ_ONLY=true -e MCP_HTTP_HOST=0.0.0.0 -e MCP_HTTP_AUTH_TOKEN=synthetic-local-token priority-mcp-server:test
          for attempt in 1 2 3 4 5; do
            if curl --fail http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs priority-smoke
          exit 1
      - if: always()
        run: docker rm -f priority-smoke || true
