<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 562" width="1200" height="562" role="img" aria-labelledby="t d">
<title id="t">Import file: the twelve official steps and the tool that runs each one</title>
<desc id="d">Twelve steps from opening an import file to landed cost per product. Teal steps are reversible and preview first. Amber steps cannot be undone and need the owner's approval. The last step is a read-only report.</desc>
